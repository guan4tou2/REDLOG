<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedLog 設定 — 全頁面原型</title>
<style>
  :root{
    --bg:#121214; --surface:#1a1a1d; --elevated:#212126; --elevated-hover:#2a2a30;
    --border-subtle:#4a4a53; --border:#74747c;
    --text:#ececf0; --text-dim:#bebec8; --text-faint:#a9a9b4; --muted:#91919c;
    --accent:#d75f63; --accent-hover:#e07478; --danger:#ff4d4f; --danger-hover:#ff6a6c;
    --safe:#5ecf9c; --warn:#d4ac5a; --cyan:#3fc7d6;
    --on-accent:#16090a; --on-danger:#1a0303;
    --radius:7px; --pad:18px; --app-zoom:.9;
    --sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;zoom:var(--app-zoom)}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(215,95,99,.35)}

  .protobar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border-subtle);background:var(--bg);color:var(--text-faint);font-size:11px}
  .protobar .proj{display:flex;align-items:center;gap:8px;color:var(--text-dim)}
  .protobar .grow{flex:1}
  .protobar .pill{border:1px solid var(--border-subtle);border-radius:999px;padding:2px 9px;color:var(--text-faint)}
  .settings{display:flex;height:calc(100vh - 41px);min-height:0}
  .settings.stacked{flex-direction:column}

  .cats{width:212px;flex:0 0 212px;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .stacked .cats{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--border-subtle)}
  .cats .searchwrap{padding:8px;border-bottom:1px solid var(--border-subtle)}
  .stacked .cats .searchwrap{display:flex;gap:6px;align-items:center;border-bottom:0}
  .cats input[type=search]{width:100%;background:var(--elevated);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px;outline:none}
  .stacked .cats input[type=search]{flex:1;min-width:0;width:auto}
  .cats input[type=search]:focus{border-color:var(--accent)}
  .cats select{display:none}
  .stacked .cats select{display:block;min-width:0;max-width:50%;background:var(--elevated);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text);padding:6px;font-size:12px;outline:none}
  .cats .scroll{flex:1;overflow-y:auto;padding:8px 0}
  .stacked .cats .scroll{display:none}
  .stacked .cats .scroll.show{display:block;max-height:220px}
  .cats .group{margin:6px 0}
  .cats .group+.group{border-top:1px solid var(--border-subtle);margin-top:8px;padding-top:8px}
  .cats .group>span{display:block;padding:4px 14px;color:var(--muted);font-size:10px;letter-spacing:.16em;font-weight:600}
  .cats .cat{display:block;width:100%;text-align:left;padding:7px 14px 7px 20px;border:0;background:transparent;color:var(--text-dim);font-size:12px;border-radius:0}
  .cats .cat:hover{background:var(--elevated);color:var(--text)}
  .cats .cat[aria-current=page]{background:var(--elevated);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
  .stacked .cats .cat{padding:6px 10px;border-radius:5px}
  .savebar{padding:7px 12px;border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-faint)}
  .stacked .savebar{border-top:0;padding:2px 10px 7px}

  .content-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .content{flex:1;min-width:0;overflow-y:auto;padding:var(--pad);overflow-wrap:anywhere}
  .content.center{max-width:920px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .page-title{font-size:15px;font-weight:700;letter-spacing:.02em}
  .page-actions{display:flex;gap:8px;flex-wrap:wrap}
  .note{color:var(--text-faint);font-size:11px;margin:0 0 14px}

  .group{margin:0 0 18px}
  .grouplabel{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:0 0 7px}
  .group-body{display:flex;flex-direction:column;gap:8px}

  .btn{background:var(--elevated);color:var(--text-dim);border:1px solid transparent;border-radius:6px;padding:5px 11px;font-size:12px}
  .btn:hover{background:var(--elevated-hover);color:var(--text)}
  .btn.quiet{background:transparent;color:var(--text-dim);padding:2px 4px}
  .btn.quiet:hover{background:transparent;color:var(--text);text-decoration:underline}
  .btn.warn{background:#9a5b12;color:#fff}
  .btn.warn:hover{background:#b06a16}
  .btn.danger{background:var(--danger);color:var(--on-danger)}
  .btn.danger:hover{background:var(--danger-hover)}
  .btn:disabled{opacity:.5;cursor:default}
  .link{background:none;border:0;color:var(--cyan);padding:0;font-size:12px;text-decoration:underline}
  .link:hover{color:var(--text)}

  .chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--elevated);color:var(--text-dim);font-size:11px;white-space:nowrap}
  .chip.priv{background:#3a1618;color:#f0a6a8}
  .chip.attn{background:#3a2c10;color:var(--warn)}
  .chip.ok{background:#123324;color:var(--safe)}
  .chip.err{background:#3a1416;color:#ff8f90}
  .chip.info{background:#102e33;color:var(--cyan)}

  .field{margin:0 0 9px}
  .field>label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:3px}
  .input{width:100%;background:var(--surface);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;font-family:var(--mono);outline:none}
  .input:focus{border-color:var(--accent)}
  .input[readonly]{color:var(--text-dim);background:transparent}
  .input.num{width:120px}
  .inputarea{width:100%;background:var(--surface);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text);padding:6px 8px;font-size:12px;font-family:var(--mono);outline:none;resize:vertical}
  .inputarea:focus{border-color:var(--accent)}
  .hint{font-size:11px;color:var(--text-faint);margin:3px 0 0;line-height:1.5}
  .warnline{font-size:11px;color:var(--warn);margin:3px 0 0}
  .errline{font-size:11px;color:#ff8f90;margin:3px 0 0}
  .okline{font-size:11px;color:var(--safe);margin:3px 0 0}
  .info{color:var(--text-faint);cursor:help;font-size:11px}

  .checkrow{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text);cursor:pointer;margin:3px 0}
  .checkrow input{accent-color:var(--accent);margin:2px 0 0;flex:none}
  .checkrow .lbl{min-width:0}
  .checkrow .sub{display:block;color:var(--text-faint);font-size:11px}

  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{background:var(--elevated);border:1px solid transparent;color:var(--text-dim);border-radius:5px;padding:4px 10px;font-size:11px}
  .seg button:hover{background:var(--elevated-hover);color:var(--text)}
  .seg button[aria-pressed=true]{color:var(--text);border-color:var(--border);background:var(--elevated)}

  .listrow{display:flex;gap:5px;align-items:center}
  .listrow .input{flex:1;min-width:0}
  .listrow .btn{flex:none;padding:4px 9px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:2px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .vpnrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 6px;min-width:0;padding:2px 0}
  .vpnrow .checkrow{margin:0}
  .vpnrow code{grid-column:1 / -1;padding-left:22px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .chipitem{display:inline-flex;align-items:center;gap:5px;background:var(--elevated);border-radius:4px;padding:2px 7px;font-size:11px;font-family:var(--mono);color:var(--text)}
  .chipitem button{background:none;border:0;color:var(--text-dim);padding:0;font-size:13px;line-height:1}
  .chipitem button:hover{color:#ff8f90}

  .card{border:1px solid var(--border-subtle);background:rgba(26,26,29,.5);border-radius:7px;padding:11px 12px;margin-bottom:8px}
  .card.dim{opacity:.62}
  .card-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .titleline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .titleline strong{font-size:12px}
  .titleline .ver{color:var(--text-faint);font-size:11px}
  .card .desc{color:var(--text-faint);font-size:11px;margin:3px 0 0}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}

  .kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;font-size:11px;margin-top:8px}
  .kv dt{color:var(--text-faint)}
  .kv dd{margin:0;color:var(--text-dim);min-width:0;line-height:1.5}
  .kv dd p{margin:0}
  .mono{font-family:var(--mono)}
  .code{background:var(--bg);border:1px solid var(--border-subtle);border-radius:5px;padding:2px 6px;font-family:var(--mono);font-size:11px;color:var(--text);overflow-wrap:anywhere}
  .cmdrow{display:flex;gap:6px;align-items:center;margin-top:5px}
  .cmdrow .code{flex:1;min-width:0;padding:4px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdrow .btn{padding:3px 8px;font-size:11px;flex:none}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar .search{flex:1;min-width:160px}
  .toolbar label{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12px;white-space:nowrap}
  .toolbar input[type=checkbox]{accent-color:var(--accent)}

  .split{display:flex;gap:16px;align-items:flex-start}
  .split .list{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .split .detail{flex:0 0 46%;max-width:460px;min-width:0;border-left:1px solid var(--border-subtle);padding-left:16px}
  .split.narrow{display:block}
  .split.narrow .detail{border-left:0;padding-left:0;max-width:none}

  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border:1px solid var(--border-subtle);background:rgba(26,26,29,.5);border-radius:var(--radius);padding:11px 12px;cursor:pointer}
  .row:hover{border-color:var(--border)}
  .row.selected{border-color:rgba(215,95,99,.65)}
  .row .main{flex:1;min-width:0}
  .row .issue{color:var(--warn);font-size:11px;margin-top:2px}
  .row .desc{color:var(--text-faint);font-size:11px;margin-top:2px;display:flex;gap:8px;align-items:center}
  .row .desc .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none}
  .row .acts button{background:var(--elevated);border:0;border-radius:5px;color:var(--text-dim);font-size:11px;padding:3px 9px}
  .row .acts button:hover{background:var(--elevated-hover);color:var(--text)}

  .detail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .detail-head .name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .detail-head strong{font-size:14px}
  .issues{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:5px}
  .issues li{color:var(--warn);font-size:11px;display:flex;gap:6px;align-items:flex-start}
  .issues li::before{content:"⚠";color:var(--warn)}
  .axis{margin:0 0 12px}
  .axis dt{color:var(--text-faint);font-size:11px;margin-bottom:3px}
  .axis dd{margin:0;display:flex;flex-direction:column;gap:3px}
  .axis dd p{margin:0;font-size:12px}
  .axis .sub{color:var(--text-faint);font-size:11px}
  .axis .err{color:#ff8f90;font-size:11px}
  .axis .actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
  .effect-group{margin:3px 0}
  .effect-group .line{font-size:11px;color:var(--text-dim)}
  .effect-group .line.warn{color:var(--warn)}
  .effect-group .rej{color:#ff8f90;font-size:11px;padding-left:10px}
  .unknown{color:var(--text-faint);font-size:11px}
  .caps{color:var(--warn);font-size:11px;margin-top:4px}
  .hintbig{color:var(--text-faint);font-size:11px;padding:10px 0}

  .fieldgroup{border:1px solid var(--border-subtle);border-radius:var(--radius);padding:14px 16px;background:rgba(26,26,29,.35)}
  .fg-title{font-size:13px;font-weight:700;margin:0 0 4px}
  .agent{border-top:1px solid var(--border-subtle);padding:14px 0}
  .agent:first-of-type{border-top:0;padding-top:6px}
  .agent-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:9px}
  .agent-head .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .agent-head strong{font-size:13px}
  .agent-head .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .agent .alert{color:#ff8f90;font-size:11px;margin:6px 0 0}
  .agent .scope{color:var(--warn);font-size:11px;margin:6px 0 0}
  .agent .paths{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
  .agent .paths li{display:flex;align-items:center;gap:8px;font-size:11px}
  .agent .paths .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);color:var(--text-dim)}
  .agent .rowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .agent details{margin-top:8px}
  .agent summary{cursor:pointer;color:var(--text-dim);font-size:11px}
  .agent details .body{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .agent .root{font-family:var(--mono);font-size:11px;color:var(--text-dim);word-break:break-all}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim)}
  .switch input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--elevated-hover);position:relative;cursor:pointer;outline:none;transition:.15s}
  .switch input:checked{background:var(--danger)}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
  .switch input:checked::after{left:16px}
  .switch input:disabled{opacity:.45;cursor:default}
  .seen{color:var(--text-faint);font-size:11px;margin-top:6px}
  .manage-link{margin-top:8px}
  .manage-link .link{font-size:11px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .dialog{background:var(--surface);border:1px solid #5b1b1e;border-radius:10px;padding:16px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .dialog h3{margin:0 0 6px;font-size:14px;color:#ff8f90}
  .dialog p{margin:0 0 10px;font-size:12px;color:var(--text-dim)}
  .dialog .box{background:var(--bg);border:1px solid var(--border-subtle);border-radius:6px;padding:8px;margin:0 0 10px}
  .dialog .box .lbl{font-size:11px;color:var(--text-faint);margin-bottom:4px}
  .dialog .box ul{margin:0;padding-left:16px;font-size:11px;color:var(--warn)}
  .dialog .foot{display:flex;justify-content:flex-end;gap:8px}
  .dialog.graded{border-color:#6b1c1f}

  #toast-root{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:var(--elevated);border:1px solid var(--border-subtle);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .18s ease-out}
  .toast.ok{border-color:#1d5b3c}
  .toast.bad{border-color:#6b1c1f}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #proto{position:fixed;left:12px;bottom:12px;z-index:70;font-size:11px}
  #proto .fold{background:#20202a;border:1px dashed var(--border);color:var(--text-faint);border-radius:8px;padding:5px 9px}
  #proto .panel{background:#17171e;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:248px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #proto .panel[hidden]{display:none}
  #proto .panel .h{color:var(--text-faint);font-size:10px;letter-spacing:.05em}
  #proto .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
  #proto .seg{display:flex;gap:3px}
  #proto .seg button{background:#22222c;border:1px solid var(--border-subtle);color:var(--text-dim);border-radius:5px;padding:3px 7px;font-size:11px}
  #proto .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #proto select{background:#22222c;border:1px solid var(--border-subtle);color:var(--text);border-radius:5px;padding:3px 6px;font-size:11px}
  #proto .hintline{color:var(--text-muted);font-size:10px}

  input[type=range]{accent-color:var(--accent);height:22px}
  summary{outline:none}
  summary::marker{color:var(--text-faint)}
  .details-body{margin-top:8px;display:flex;flex-direction:column;gap:8px}
</style>
<style>.protobar{display:none}body{zoom:1}.settings{height:100vh}</style></head>
<body>
  <header class="protobar">
    <span class="proj"><span>◀</span><strong>plugin-explore</strong></span>
    <span class="grow"></span>
    <span class="pill">設定 · 原型</span>
  </header>

  <div class="settings" id="shell">
    <nav class="cats" id="cats" aria-label="設定分類"></nav>
    <div class="content-col">
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <div id="proto">
    <button class="fold" data-action="proto-toggle" aria-expanded="false">原型控制</button>
    <div class="panel" id="proto-panel" hidden>
      <div class="h">原型控制(非產品介面)</div>
      <div class="line"><span>語言</span>
        <div class="seg" data-proto-seg="lang">
          <button data-action="lang" data-id="zh" aria-pressed="true">中文</button>
          <button data-action="lang" data-id="en" aria-pressed="false">English</button>
        </div>
      </div>
      <div class="line"><span>布局</span>
        <div class="seg" data-proto-seg="layout">
          <button data-action="layout" data-id="auto" aria-pressed="true">自動</button>
          <button data-action="layout" data-id="wide" aria-pressed="false">寬</button>
          <button data-action="layout" data-id="narrow" aria-pressed="false">窄</button>
        </div>
      </div>
      <div class="line"><span>Codex 整合</span>
        <select data-change="codex-state">
          <option value="update-available">可更新</option>
          <option value="not-installed">未安裝</option>
          <option value="installed">已安裝</option>
          <option value="conflict">衝突</option>
          <option value="error">錯誤</option>
        </select>
      </div>
      <div class="hintline">「自動」依視窗寬度切換分類列與列表/詳情。</div>
    </div>
  </div>

<script>
"use strict";

/* ------------------------------------------------------------------ */

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}

const group = (title, body) => '<section class="group"><h2 class="grouplabel">' + esc(title) + '</h2><div class="group-body">' + body + '</div></section>';

const checkRow = (label, path, opts) => {
  opts = opts || {};
  const checked = opts.value != null ? opts.value : !!getPath(cfg, path);
  return '<label class="checkrow"><input type="checkbox" data-toggle="' + path + '" ' + (checked ? 'checked' : '') + '><span class="lbl">' + (opts.html || esc(label)) + (opts.sub ? '<span class="sub">' + esc(opts.sub) + '</span>' : '') + '</span></label>'
    + (opts.hint ? '<p class="hint">' + esc(opts.hint) + '</p>' : '');
};

const field = (label, path, opts) => {
  opts = opts || {};
  const v = opts.value != null ? opts.value : getPath(cfg, path);
  return '<div class="field"><label>' + esc(label)
    + (opts.hintIcon ? ' <span class="info" title="' + esc(opts.hintIcon) + '">&#9432;</span>' : '')
    + '</label><input class="input ' + (opts.num ? 'num' : '') + '" type="' + (opts.type || 'text') + '" data-field="' + path + '" value="' + esc(v) + '"' + (opts.readonly ? ' readonly' : '') + '>'
    + (opts.hint ? '<p class="hint">' + esc(opts.hint) + '</p>' : '')

};

  if (s === 'not-installed') return '<span class="hint">' + esc(t('agent.notInstalled')) + '</span>';

  else if (s === 'update-available') control = link(t('agent.goUpdate'), 'goto-plugin', p.id) + control;

function scopeMatch(host, rule) {
  if (!host) return false;
  if (rule === host) return true;
  if (rule.indexOf('*.') === 0) return host.endsWith(rule.slice(1));
  if (rule.indexOf('/') > 0) {
    const parts = rule.split('/');
    const toInt = (ip) => ip.split('.').reduce((n, p) => (n << 8) + (parseInt(p, 10) & 255), 0) >>> 0;
    if (!/^\d+\.\d+\.\d+\.\d+$/.test(host) || !/^\d+\.\d+\.\d+\.\d+$/.test(parts[0])) return false;
    const bits = parseInt(parts[1], 10);
    const mask = bits === 0 ? 0 : (0xffffffff << (32 - bits)) >>> 0;
    return (toInt(host) & mask) === (toInt(parts[0]) & mask);
  }
  return false;
}
function scopeVerdict(input) {
  const s = String(input || '').trim();
  if (!s) return null;
  const ex = cfg.scope.excludeTargets.find(function (r) { return scopeMatch(s, r) });
  if (ex) return { tone: 'bad', key: 'settings.scopeTest.excluded', vars: { rule: ex } };
  const hit = cfg.scope.targets.find(function (r) { return scopeMatch(s, r) });
  if (hit) return { tone: 'good', key: 'settings.scopeTest.inScope', vars: { rule: hit } };
  return { tone: 'bad', key: 'settings.scopeTest.outOfScope', vars: {} };
}
function scopeVerdictHtml(v) {
  if (!v) return '';
  const color = v.tone === 'good' ? 'var(--safe)' : '#ffcf7a';
  return '<p role="status" style="color:' + color + ';font-size:11px;margin:0">' + esc(t(v.key, v.vars)) + '</p>';
}

/* --- HUD ------------------------------------------------------------- */
function pageHud() {
  const stops = [
    { v: 0.75, k: 'settings.overlayScale.xs' }, { v: 0.85, k: 'settings.overlayScale.small' },
    { v: 1, k: 'settings.overlayScale.normal' }, { v: 1.25, k: 'settings.overlayScale.large' },
    { v: 1.5, k: 'settings.overlayScale.xlarge' }, { v: 1.75, k: 'settings.overlayScale.xxl' }
  ];
  const cur = cfg.overlay.scale || 1;
  let nearest = stops[0];
  stops.forEach(function (s) { if (Math.abs(cur - s.v) < Math.abs(nearest.v - cur)) nearest = s });
  const idx = stops.indexOf(nearest);
  return pageHead(t('settings.pageHud'))
    + group(t('settings.overlayGroup'),
      checkRow(t('settings.overlayAutoShow'), 'overlay.autoShow', { hint: t('settings.overlayAutoShowHint') })

const ago = function (ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (ui.lang === 'en') {
    if (s < 90) return s + 's ago';
    if (s < 5400) return Math.round(s / 60) + ' min ago';
    return Math.round(s / 3600) + ' h ago';
  }
  if (s < 90) return s + ' 秒前';
  if (s < 5400) return Math.round(s / 60) + ' 分鐘前';
  return Math.round(s / 3600) + ' 小時前';
};

function effectGroups(p) {

    if (!g) return;
    out.push({ key: key, accepted: g.accepted, rejected: g.rejected || [], waiting: g.waiting });
  };
  push('loot', r.lootPatterns);
  push('targetExtractors', r.targetExtractors);
  push('commandTags', r.commandTags);
  push('eventTypes', r.eventTypes);
  push('capture', r.capture);

}
function pluginIssues(p) {
  const out = [];
  if (p.official) {
    const s = p.install.state;
    if (s === 'update-available') out.push('update');
    if (s === 'conflict') out.push('conflict');
    if (s === 'error') out.push('installError');
    if (p.health.state === 'error') out.push('captureError');
    if (s === 'update-available' || s === 'conflict' || s === 'error') return out;
  }
  if (p.status === 'error') out.push('error');
  if (p.status === 'hash-changed') out.push('hashChanged');
  if (p.status === 'needs-consent') out.push('needsConsent');

function rerenderKeep(sel) {
  const el = document.querySelector(sel);
  const focused = el && document.activeElement === el;
  const pos = focused ? el.selectionStart : 0;
  render();
  if (focused) {
    const next = document.querySelector(sel);
    if (next) { next.focus(); try { next.setSelectionRange(pos, pos) } catch (e) { /* number inputs */ } }
  }
}
function closeModal() { ui.modal = null; render(); }
function clickAction(act, e) {
  const action = act.dataset.action;
  const id = act.dataset.id;
  switch (action) {
    case 'nav': ui.page = id; render(); break;
    case 'close-modal':
      if (act.classList.contains('overlay') && e.target.closest('.dialog')) return;
      closeModal(); break;
    case 'confirm-uninstall': {
      const p = pluginRows().find(function (x) { return x.id === id });
      if (p) { pm.officialStates[id] = 'not-installed'; pm.projectEnabled[id] = false; }
      ui.modal = null; render(); toast(t('toast.removed', { name: p ? p.name : id }));
      break;
    }
    case 'confirm-consent': {
      const p = pluginRows().find(function (x) { return x.id === id });
      if (p) {
        pm.userStatus[id] = 'active';
        if (p.terminalProfiles) pm.reports[id] = { terminalProfiles: { accepted: 1, rejected: [] } };
      }
      ui.modal = null; render(); toast(t('toast.approved', { name: p ? p.name : id }));
      break;
    }
    case 'confirm-spool': {
      const n = ui.spool ? ui.spool.count : 0;
      ui.spool = null; ui.modal = null; render(); toast(t('toast.cleared', { n: n }));
      break;
    }
    case 'plugin-select': pm.selected = id; render(); break;
    case 'plugin-back': pm.selected = null; render(); break;
    case 'plugin-install': case 'plugin-update': {
      const p = pluginRows().find(function (x) { return x.id === id });
      pm.busy = id; render();
      setTimeout(function () {
        if (p) { pm.officialStates[id] = 'installed'; pm.projectEnabled[id] = pm.projectEnabled[id] === true; }
        pm.busy = null; render();
        toast(t(action === 'plugin-install' ? 'toast.installed' : 'toast.updated', { name: p ? p.name : id }));
      }, 900);
      break;
    }
    case 'plugin-uninstall': ui.modal = { type: 'uninstall', id: id }; render(); break;
    case 'plugin-toggle': {
      const p = pluginRows().find(function (x) { return x.id === id });
      if (p) pm.userStatus[id] = p.status === 'disabled' ? 'active' : 'disabled';
      render();
      toast(t(p && p.status === 'disabled' ? 'toast.trustOn' : 'toast.trustOff', { name: p ? p.name : id }));
      break;
    }
    case 'plugin-review': ui.modal = { type: 'consent', id: id }; render(); break;
    case 'plugin-revoke': {
      const p = pluginRows().find(function (x) { return x.id === id });
      pm.userStatus[id] = 'needs-consent';
      if (p) pm.reports[id] = { terminalProfiles: { accepted: 0, rejected: [], waiting: true } };
      render(); toast(t('toast.revoked', { name: p ? p.name : id }));
      break;
    }
    case 'goto-plugin': ui.page = 'plugins'; pm.selected = id; render(); break;
    case 'goto-capture': ui.page = 'captureControl'; render(); break;
    case 'copy': {
      const text = act.dataset.copy || '';
      const done = function () { toast(t('toast.copied')); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { toast(t('toast.copied')); });
      } else toast(t('toast.copied'));
      break;
    }
    case 'toast': toast(act.dataset.text || L('這是原型，按鈕不會真的執行。', 'Prototype only — nothing runs.')); break;
    case 'lang': ui.lang = id; render(); break;
    case 'layout': ui.layout = id; render(); break;
    case 'proto-toggle': ui.protoOpen = !ui.protoOpen; render(); break;
    case 'rescan': toast(L('已重新掃描終端工具設定檔。', 'Rescanned terminal tool profiles.')); break;
    case 'hook-connect': toast(t('toast.connected')); break;
    case 'hook-disable': case 'teardown': toast(t('toast.disabled')); break;
    case 'proxy-toggle':
      ui.proxy = ui.proxy === 'running' ? 'stopped' : 'running';
      ui.proxyVerified = ui.proxy === 'running';
      render();
      toast(t(ui.proxy === 'running' ? 'toast.started' : 'toast.stopped'));
      touchSave(); break;
    case 'browser-launch': toast(L('已用這個代理開啟瀏覽器（原型）。', 'Opened the browser through this proxy (prototype).')); break;
    case 'cdp-test': ui.cdpConnected = true; render(); toast(t(ui.cdpConnected ? 'settings.cdpConnected' : 'settings.cdpNotConnected')); break;
    case 'integrity-anchor':
      ui.busy = 'anchor'; render();
      setTimeout(function () { ui.busy = null; render(); toast(t('toast.anchored')); touchSave(); }, 800);
      break;
    case 'integrity-verify':
      ui.busy = 'verify'; ui.verify = null; render();
      setTimeout(function () {
        ui.busy = null;
        ui.verify = { ok: true, walked: 1284, head: '9f3c7a1e88b2d4c6f0a1b3c5d7e9f1a3' };
        render();
      }, 700);
      break;
    case 'integrity-upgrade': toast(t('toast.upgraded', { n: 1 })); break;
    case 'about-check':
      ui.aboutStage = 'checking'; render();
      setTimeout(function () {
        ui.aboutStage = 'up-to-date';
        const d = new Date();
        ui.aboutCheckedAt = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        render(); toast(t('toast.checked'));
      }, 900);
      break;
    case 'debug-reveal': toast(L('已在 Finder 中顯示 log（原型）。', 'Revealed the log in Finder (prototype).')); break;
    case 'profile-export': toast(t('toast.exported')); break;
    case 'spool-clear': ui.modal = { type: 'spool' }; render(); break;
    case 'add-vpn': {
      const name = String(ui.drafts['vpn.name'] || '').trim();
      const pattern = String(ui.drafts['vpn.pattern'] || '').trim();
      if (!name || !pattern) { toast(L('請先填名稱與規則。', 'Fill in a name and a pattern first.')); break; }
      try { new RegExp(pattern) } catch (err) { toast(L('無效的規則表達式。', 'Invalid regular expression.')); break; }
      cfg.network.vpnAdapters.push({ name: name, pattern: pattern, enabled: true });
      ui.drafts['vpn.name'] = ''; ui.drafts['vpn.pattern'] = '';
      render(); touchSave(); break;
    }
  }
}
function onClick(e) {
  const listAdd = e.target.closest('[data-list-add]');
  if (listAdd) { addListItem(listAdd.dataset.listAdd); return; }
  const listRemove = e.target.closest('[data-list-remove]');
  if (listRemove) {
    const path = listRemove.dataset.listRemove;
    const items = getPath(cfg, path);
    items.splice(Number(listRemove.dataset.index), 1);
    render(); touchSave(); return;
  }
  const adapterRemove = e.target.closest('[data-adapter-remove]');
  if (adapterRemove) {
    cfg.network.vpnAdapters.splice(Number(adapterRemove.dataset.adapterRemove), 1);
    render(); touchSave(); return;
  }
  const segBtn = e.target.closest('[data-seg]');
  if (segBtn) {
    const path = segBtn.dataset.seg;
    let v = segBtn.dataset.value;
    if (v !== '' && !isNaN(Number(v)) && typeof getPath(cfg, path) === 'number') v = Number(v);
    setPath(cfg, path, v);
    render(); touchSave(); return;
  }
  const numBtn = e.target.closest('[data-num]');
  if (numBtn) {
    setPath(cfg, numBtn.dataset.num, Number(numBtn.dataset.value));
    render(); touchSave(); return;
  }
  const uiSeg = e.target.closest('[data-uiseg]');
  if (uiSeg) { ui[uiSeg.dataset.uiseg] = uiSeg.dataset.value; render(); return; }
  const overlayScale = e.target.closest('[data-overlay-scale]');
  if (overlayScale) {
    cfg.overlay.scale = Number(overlayScale.dataset.overlayScale);
    render(); touchSave(); return;
  }
  const scaleBtn = e.target.closest('[data-scale]');
  if (scaleBtn) {
    ui.scale = Number(scaleBtn.dataset.scale);
    document.body.style.setProperty('--app-zoom', String(Math.round(ui.scale * 0.9 * 1000) / 1000));
    render(); return;
  }
  const act = e.target.closest('[data-action]');
  if (act) clickAction(act, e);
}
function numOrString(path, raw) {
  const cur = getPath(cfg, path);
  return typeof cur === 'number' ? Number(raw) : raw;
}
function onInput(e) {
  const el = e.target;
  if (el.matches('[data-field]')) {
    setPath(cfg, el.dataset.field, numOrString(el.dataset.field, el.value));
    touchSave(); return;
  }
  if (el.matches('[data-size]')) {
    setPath(cfg, el.dataset.size, Math.max(0, Number(el.value) || 0) * 1048576);
    touchSave(); return;
  }
  if (el.matches('[data-draft]')) { ui.drafts[el.dataset.draft] = el.value; return; }
  if (el.matches('[data-uifield="scopeTest"]')) {
    ui.scopeTest = el.value;
    const box = document.getElementById('scope-verdict');
    if (box) box.innerHTML = scopeVerdictHtml(scopeVerdict(ui.scopeTest));
    return;
  }
  if (el.matches('[data-plugin-search]')) { pm.query = el.value; rerenderKeep('[data-plugin-search]'); return; }
  if (el.matches('[data-nav-search]')) { ui.navQuery = el.value; rerenderKeep('[data-nav-search]'); return; }
  if (el.matches('[data-scale-range]')) {
    const stops = [0.75, 0.85, 1, 1.25, 1.5, 1.75];
    cfg.overlay.scale = stops[Number(el.value)] || 1;
    document.querySelectorAll('.scalestop').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Math.abs(Number(b.dataset.scale) - cfg.overlay.scale) < 0.01));
    });
    const t0 = document.querySelector('.scalestop[aria-pressed="true"]');
    if (t0) el.setAttribute('aria-valuetext', t0.textContent);
    touchSave(); return;
  }
  if (el.matches('[data-opacity-range]')) {
    cfg.overlay.passThroughOpacity = Number(el.value);
    const out = document.getElementById('opacity-val');
    if (out) out.textContent = Math.round(Number(el.value) * 100) + '%';
    touchSave(); return;
  }
}
function onChange(e) {
  const el = e.target;
  if (el.matches('[data-toggle]')) {
    setPath(cfg, el.dataset.toggle, el.checked);
    render(); touchSave(); return;
  }
  if (el.matches('[data-loot]')) {
    const id = el.dataset.loot;
    const list = cfg.loot.disabledRules;
    const i = list.indexOf(id);
    if (el.checked && i >= 0) list.splice(i, 1);
    if (!el.checked && i < 0) list.push(id);
    render(); touchSave(); return;
  }
  if (el.matches('[data-agent-enable]')) {
    pm.projectEnabled[el.dataset.agentEnable] = el.checked;
    render(); touchSave(); return;
  }
  if (el.matches('[data-plugin-attention]')) { pm.attentionOnly = el.checked; render(); return; }
  if (el.matches('[data-plugin-search]')) { pm.query = el.value; rerenderKeep('[data-plugin-search]'); return; }
  if (el.matches('[data-nav-select]')) { ui.page = el.value; render(); return; }
  if (el.matches('[data-uiselect]')) { ui[el.dataset.uiselect] = el.value; render(); touchSave(); return; }
  if (el.matches('[data-change="codex-state"]')) {
    pm.officialStates['official-ai-codex'] = el.value;
    render(); return;
  }
}
function validTarget(v) {
  if (/^\d+\.\d+\.\d+\.\d+\/\d{1,2}$/.test(v)) return Number(v.split('/')[1]) <= 32;
  return /^(\*\.)?[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$/.test(v);
}
function addListItem(path) {
  const raw = String(ui.drafts[path] || '').trim();
  if (!raw) return;
  const items = getPath(cfg, path);
  const rejected = [];
  raw.split(/[\s,]+/).filter(Boolean).forEach(function (v) {
    if (path.indexOf('targets') >= 0 && !validTarget(v)) { rejected.push(v); return; }
    if (items.indexOf(v) === -1) items.push(v);
  });
  ui.rejects[path] = rejected;
  ui.drafts[path] = '';
  render(); touchSave();
}


/* boot */
state_selected_default();
new ResizeObserver((entries) => {
  for (const e of entries) {
    ui.liveWidth = e.contentRect.width;
    const nowNarrow = isNarrowContent();
    if (ui._contentNarrow !== nowNarrow) { ui._contentNarrow = nowNarrow; render(); }
  }
}).observe(document.querySelector('.content-col'));
window.addEventListener('resize', () => {
  const nn = isNarrowNav();
  const cn = isNarrowContent();
  if (ui._navNarrow !== nn || ui._contentNarrow !== cn) { ui._navNarrow = nn; ui._contentNarrow = cn; render(); }
});
document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.body.style.setProperty('--app-zoom', String(Math.round(ui.scale * 0.9 * 1000) / 1000));
render();
ui._navNarrow = isNarrowNav();
ui._contentNarrow = isNarrowContent();
</script>
</body>
