<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon mark — mini version -->
  <rect x="4" y="10" width="100" height="100" rx="22" ry="22" fill="#111" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Mini R -->
  <g filter="url(#glow)">
    <path d="
      M 28 30
      L 28 90
      L 38 90
      L 38 65
      L 56 65
      L 74 90
      L 86 90
      L 66 63
      Q 78 60 78 48
      Q 78 35 68 31
      Q 63 30 56 30
      Z
      M 38 40
      L 56 40
      Q 63 40 66 43
      Q 70 46 70 49
      Q 70 52 66 55
      Q 63 58 56 58
      L 38 58
      Z
    " fill="url(#rGrad)"/>
  </g>

  <!-- Diagonal slash on mini R -->
  <line x1="66" y1="24" x2="48" y2="96" stroke="#111" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="66" y1="24" x2="48" y2="96" stroke="#dc2626" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Recording dot -->
  <circle cx="88" cy="26" r="5" fill="#ef4444" filter="url(#dotGlow)"/>
  <circle cx="88" cy="26" r="2.5" fill="#fff" opacity="0.3"/>

  <!-- REDLOG wordmark -->
  <text x="124" y="75" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="8" fill="#e5e5e5" filter="url(#glow)">
    <tspan fill="#ef4444">RED</tspan><tspan fill="#a3a3a3">LOG</tspan>
  </text>

  <!-- Subtle tagline -->
  <text x="126" y="98" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#525252">
    RED TEAM OPERATION LOG
  </text>
</svg>
