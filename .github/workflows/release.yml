name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

# Build each platform in parallel and only PACKAGE (never publish) here.
# Two concurrent `electron-builder --publish always` jobs race to create the
# GitHub release and end up with two release objects for one tag — which is
# exactly how v0.2.1 first shipped mac-only. Collect the artifacts and let a
# single downstream job create one release.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        # `npm ci` is strict about lockfile↔node/npm version parity and the
        # solo-dev workflow here doesn't pin a node runtime, so lock drift
        # blocks releases. `npm install --no-audit --no-fund` is one step
        # looser and reconciles at install time — dep resolution still deterministic
        # via the lock, just tolerant of the optional-platform-entry drift
        # between different npm majors.
        run: npm install --no-audit --no-fund

      - name: Run tests (Node ABI)
        run: npm test

      - name: Build renderer + main
        run: npm run build

      - name: Package macOS (dmg + zip, arm64)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Package Windows (nsis + portable, x64)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: redlog-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fail_on_unmatched_files: false
          files: artifacts/**/*
