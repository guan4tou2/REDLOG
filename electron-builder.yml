appId: com.redlog.app
productName: RedLog
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
# Ship the stdio MCP bridge + hook scripts alongside the app so the packaged
# build can point at them (HTTP MCP needs none of this, but stdio + hook
# install do).
extraResources:
  - from: mcp
    to: mcp
  - from: hooks
    to: hooks
  - from: shell
    to: shell
  # 🔴 plugin isolation runner — forked into a utilityProcess for trusted plugins
  - from: resources/plugin-runner.js
    to: plugin-runner.js
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  extendInfo:
    # macOS gates the Wi-Fi SSID behind Location Services; this lets RedLog
    # request it (opt-in) so the HUD can show the real network name.
    NSLocationWhenInUseUsageDescription: RedLog uses your location only to read the current Wi-Fi network name for the operator HUD. No location data leaves your machine.
    NSLocationUsageDescription: RedLog uses your location only to read the current Wi-Fi network name for the operator HUD. No location data leaves your machine.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  icon: resources/icon-256.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: resources/icon-256.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
publish:
  provider: github
  releaseType: release
