appId: com.redlog.app
productName: RedLog
directories:
  buildResources: resources
  output: dist
# Native modules must live outside the asar so they can be loaded at runtime.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
files:
  - out/**/*
  - resources/**/*
# Rebuild native deps (better-sqlite3) against the packaged Electron ABI.
npmRebuild: true

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  icon: resources/icon-256.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RedLog

linux:
  icon: resources/icon-256.png
  target:
    - AppImage
  category: Development
