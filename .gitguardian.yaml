# GitGuardian configuration.
#
# RedLog is a security tool whose test suite deliberately contains
# secret-shaped fixtures: the loot detector, the four-layer redaction, the
# credential_use producer and the sanitizer are all tested against realistic
# API keys, JWTs, private-key headers and passwords, because a detector that
# is never shown a real-looking secret is not actually tested. Those strings
# are fake by construction (AWS's own documentation key AKIAIOSFODNN7EXAMPLE,
# `ghp_` placeholders, `admin:hunter2`), not live credentials.
#
# So secret scanning ignores the test trees. Application code, hooks, docs and
# config are still scanned — a real secret must never live there, and nothing
# in this repo puts one there.
version: 2
secret:
  ignored-paths:
    - "test/**"
    - "e2e/**"
