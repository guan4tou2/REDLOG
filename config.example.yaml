# RedLog Configuration
# Copy to ~/.redlog/config.yaml and edit

engagement:
  id: pentest-2026-001
  name: "Example Corp External Pentest"

operator:
  id: op-1
  name: "Operator"

network:
  # VPN exit IPs — when external IP matches, shows "VPN Connected" (green)
  vpnIPs:
    - 10.8.0.0/24
    - 203.0.113.42

  # Daily/home IPs — when external IP matches, shows "No VPN" (red)
  # Put your ISP IPs here so the overlay warns you if VPN drops
  dailyIPs:
    - 114.24.97.0/24
    - 36.225.0.0/16

  # IP check interval in seconds
  checkInterval: 10
  emergencyPause: false

# Scope definition (optional)
scope:
  # warn | log  (legacy field; migrated to scope.warnOnViolation on load.
  #               `block` was removed — RedLog never blocks, see docs/ALERT-ROLES.md Part D)
  enforcement: warn
  # In-scope targets (IPs, CIDRs, wildcard domains)
  targets:
    - 10.0.0.0/8
    - 192.168.1.0/24
    - "*.example.com"
  # Container width for the D2 "same subnet, wrong host" alert. It applies only
  # to SINGLE-IP scope entries: had the list above contained 192.168.1.10, then
  # 192.168.1.0/24 would count as adjacent and hitting .55 would warn. Entries
  # already written as CIDRs (10.0.0.0/8) state their own boundary and are never
  # widened; outside them is unrelated, not adjacent.
  proximityBits: 24
  # Extra multi-label public suffixes, used to decide "same registrable domain"
  # for the D2 same-domain alert. RedLog ships a curated table (co.uk, com.tw,
  # github.io, s3.amazonaws.com, ...); add here only what it does not know. An
  # unknown suffix over-matches (noisy) rather than going silent, so this is a
  # noise-reduction knob, not a safety-critical one.
  publicSuffixes: []
  # Explicitly excluded targets
  excludeTargets:
    - 10.0.0.1
    - "dc01.corp.example.com"
